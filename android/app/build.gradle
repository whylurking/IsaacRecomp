apply plugin: 'com.android.application'

android {
    namespace 'io.github.isaacrecomp'
    compileSdkVersion 34
    ndkVersion '27.2.12479018'   // (NDK r27c; Gradle downloads it if missing)
    defaultConfig {
        applicationId 'io.github.isaacrecomp'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 150
        versionName '1.5.0'
        externalNativeBuild {
            cmake {
                // the whole native program (runtime + recompiled game + SDL2) comes from the repository's CMakeLists.txt
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
                abiFilters 'arm64-v8a'
            }
        }
    }
    // Signed with the debug key unless a keystore is given through environment variables (see android/README.md).
    // The debug key is fine for installing the APK by hand; a fixed key lets new versions install over old ones.
    signingConfigs {
        if (System.getenv('ISAAC_KEYSTORE')) {
            isaac {
                storeFile file(System.getenv('ISAAC_KEYSTORE'))
                storePassword System.getenv('ISAAC_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ISAAC_KEY_ALIAS')
                keyPassword System.getenv('ISAAC_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ISAAC_KEYSTORE') ? signingConfigs.isaac : signingConfigs.debug
        }
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }   // (a debug build of the game is far too slow)
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    lint {
        abortOnError false
    }
}
